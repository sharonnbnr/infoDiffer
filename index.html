<style>
:root{--bg:#0b0d12;--bg2:#12151c;--bg3:#1a1f2b;--line:#2a3142;--tx:#e8edf7;--mut:#8b95a8;--pos:#7fd99a;--neg:#f07178;--promo:#e6c07b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,ui-sans-serif,system-ui,"Noto Sans SC","Noto Sans KR","Noto Sans JP",sans-serif}
a{color:#9ec1ff;text-decoration:none}button,input{font:inherit}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,13,18,.94);backdrop-filter:blur(10px);z-index:5}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6ee7b7,#7aa2ff);display:grid;place-items:center;color:#0b0d12;font-weight:800}
.brand h1{margin:0;font-size:16px}.brand p{margin:0;color:var(--mut);font-size:12px}
.langs,.tabs{display:flex;gap:6px;flex-wrap:wrap}
.langs button,.tabs button,.chip{background:var(--bg3);border:1px solid var(--line);color:var(--tx);padding:6px 10px;border-radius:999px;cursor:pointer}
.langs button.on,.tabs button.on,.chip.on{background:#243018;border-color:#3d5a32}
.wrap{padding:18px 22px 48px;max-width:1280px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card b{display:block;font-size:20px}.card span{color:var(--mut);font-size:12px}
.note{color:var(--mut);font-size:12px;margin:0 0 12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.tone-hot,.tone-pos{color:var(--pos)}.tone-promo{color:var(--promo)}.tone-mixed{color:#e6c07b}
.tone-silent,.tone-quiet{color:var(--mut)}.tone-neg,.tone-opinion{color:#f0a0a6}.tone-news{color:#b7c7e0}
.gap{font-size:12px;color:var(--mut)}
.post{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.post .meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin-bottom:6px}
.tag{border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:11px}
.S{color:#f5c14a}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.top{flex-direction:column;align-items:flex-start;gap:10px}}
</style>

</header>
<main class="wrap">

    <button data-tab="ALL" data-i18n="tabAll">all</button>
  </nav>
  <div id="main"></div>
</main>

let lang='zh', tab='board', q='', fTier='ALL';
function t(k){return I18N[lang][k]||k}

function loc(obj){ if(!obj) return ''; if(typeof obj==='string') return obj; return obj[lang]||obj.zh||obj.en||''; }
function toneLabel(code){ return t('tone_'+code)||code; }
function krCell(z){
  const promo=z.mentions?Math.round(z.promo/z.mentions*100):0;
  return `<div class="tone-${z.tone}">${z.channels} ${t('ch')} · ${z.mentions} ${t('posts')} · ${toneLabel(z.tone)}</div>
    <div class="gap">${t('promo')} ${promo}%</div>
    <div class="gap">${loc(z.summary_i18n)||z.summary||''}</div>`;
}
function sideCell(z){
  if(!z) return `<div class="gap">${t('unfetched')}</div>`;
  const sum=loc(z.summary_i18n)||z.summary||'';
  if(z.tone==='silent'||z.tone==='quiet') return `<div class="tone-silent">${t('zero')}</div><div class="gap">${sum}</div>`;
  const n=z.channels||z.mentions||0;
  return `<div class="tone-${z.tone}">${n} · ${toneLabel(z.tone)}</div><div class="gap">${sum}</div>`;
}
function renderBoard(){
  const rows=PROJECTS.map(p=>`<tr>
    <td><b>${loc(p.name_i18n)||p.project}</b><div class="gap">${p.origin||''} · ${p.ticker} · ${loc(p.gap_i18n)||''}</div></td>
    <td>${sideCell(p.cn)}</td>
    <td>${krCell(p.kr)}</td>
    <td>${sideCell(p.jp)}</td>
  </tr>`).join('');
  return `<p class="note">${t('demo')}<br>${t('boardNote')}</p>
  <table><thead><tr><th>${t('colProject')}</th><th>${t('colCN')}</th><th>${t('colKR')}</th><th>${t('colJP')}</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function renderCNFeed(){
  const posts=CNFEED.filter(p=>!q || (p.name+p.text+p.tags.join(' ')).toLowerCase().includes(q.toLowerCase())).map(p=>`<article class="post">
    <div class="meta"><span class="${p.tier}">${p.tier}</span><b>${p.name}</b><span>@${p.handle}</span><span>${p.dt}</span><span>${p.views||''}</span>
    ${p.tags.map(x=>'<span class="tag">'+x+'</span>').join('')}
    <span class="tag tone-${p.intent}">${toneLabel(p.intent)||p.intent}</span>
    ${p.url?'<a href="'+p.url+'" target="_blank">'+t('src')+'</a>':''}</div>
    <div>${p.text}</div>
  </article>`).join('');
  return `<div class="filters"><input id="q" value="${q}" placeholder="${t('search')}" style="flex:1;min-width:180px;background:#12151c;border:1px solid #2a3142;color:#e8edf7;padding:7px 10px;border-radius:10px"></div>
  <p class="note">${CNFEED.length} ${t('feedNote')}</p>${posts}`;
}
function renderFeed(){
  let items=FEED.filter(p=>!q || (p.name+p.text+p.tags.join(' ')).toLowerCase().includes(q.toLowerCase()));
  const posts=items.map(p=>`<article class="post">
    <div class="meta"><span class="${p.tier}">${p.tier}</span><b>${p.name}</b><span>@${p.handle}</span><span>${p.dt}</span><span>${p.views||''}</span>
    ${p.tags.map(x=>'<span class="tag">'+x+'</span>').join('')}
    <span class="tag tone-${p.intent}">${toneLabel(p.intent)||p.intent}</span>
    ${p.url?'<a href="'+p.url+'" target="_blank">'+t('src')+'</a>':''}</div>
    <div>${p.text}</div>
  </article>`).join('');
  return `<div class="filters"><input id="q" value="${q}" placeholder="${t('search')}" style="flex:1;min-width:180px;background:#12151c;border:1px solid #2a3142;color:#e8edf7;padding:7px 10px;border-radius:10px"></div>
  <p class="note">${items.length} ${t('feedNote')}</p>${posts}`;
}
function filt(list){
  return list.filter(r=>{
    if(tab==='KR'&&r.region!=='KR')return false;
    if(tab==='CN'&&r.region!=='CN')return false;
    if(tab==='JP'&&r.region!=='JP')return false;
    if(fTier!=='ALL'&&r.tier!==fTier)return false;
    if(q && !(r.name+' '+(r.handle||'')+' '+r.type).toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });
}
function renderRoster(list){
  const items=filt(list);
  const rows=items.map(r=>`<tr><td class="${r.tier}">${r.tier}</td><td>${r.region}</td>
    <td><a href="${r.link}" target="_blank">${r.name}</a><div class="gap">${r.handle||''}</div></td>
    <td>${r.platform}</td><td>${r.type}</td><td class="gap">${r.followers_raw}</td></tr>`).join('');
  return `<div class="filters">
    <input id="q" value="${q}" placeholder="${t('search')}" style="flex:1;min-width:180px;background:#12151c;border:1px solid #2a3142;color:#e8edf7;padding:7px 10px;border-radius:10px">
    ${['ALL','S','A','B'].map(x=>`<button class="chip ${fTier===x?'on':''}" data-tier="${x}">${x}</button>`).join('')}
  </div><p class="note">${items.length} / ${list.length}</p>
  <table><thead><tr><th>${t('colTier')}</th><th>${t('colRegion')}</th><th>${t('colName')}</th><th>${t('colPlat')}</th><th>${t('colType')}</th><th>${t('colFol')}</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function paint(){
  document.getElementById('title').textContent=t('title');
  document.getElementById('sub').textContent=t('sub');
  ['stat0','stat1','stat2','stat3'].forEach(id=>{const el=document.getElementById(id); if(el) el.textContent=t(id);});
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  document.querySelectorAll('.tabs button').forEach(b=>{b.textContent=t(b.dataset.i18n);b.classList.toggle('on',b.dataset.tab===tab)});
  const box=document.getElementById('main');
  box.innerHTML= tab==='board'?renderBoard(): tab==='feed'?renderFeed(): tab==='cnfeed'?renderCNFeed():renderRoster(KOLS);
  const inp=document.getElementById('q');
  if(inp) inp.oninput=e=>{q=e.target.value;paint()};
  document.querySelectorAll('[data-tier]').forEach(b=>b.onclick=()=>{fTier=b.dataset.tier;paint()});
}
document.addEventListener('click',e=>{
  const l=e.target.closest('[data-lang]'); if(l){lang=l.dataset.lang;paint()}
  const tb=e.target.closest('[data-tab]'); if(tb){tab=tb.dataset.tab;q='';fTier='ALL';paint()}
});
window.onload=paint;

</script>
</body></html>
